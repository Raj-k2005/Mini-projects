<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Coffee Brew</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary:   #3b141c;
      --secondary: #f3a01c;
      --dark:      #1a0a0e;
      --white:     #fff;
      --green:     #22c55e;
      --blue:      #3b82f6;
      --orange:    #f97316;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--primary);
      padding: 0 24px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: sticky; top:0; z-index:100;
    }
    .topbar-brand {
      font-size: 1.1rem; font-weight: 800;
      color: var(--secondary); letter-spacing: 1px;
    }
    .topbar-nav { display: flex; gap: 8px; }
    .nav-pill {
      padding: 6px 16px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 600;
      text-decoration: none; color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all .2s;
    }
    .nav-pill:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
    .nav-pill.active { color: var(--secondary); border-color: var(--secondary); background: rgba(243,160,28,0.08); }

    /* ── Page ── */
    .page { max-width: 700px; margin: 0 auto; padding: 36px 20px 80px; }

    .page-header { margin-bottom: 28px; }
    .page-title {
      font-size: 1.6rem; font-weight: 800; color: var(--white);
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .page-title i { color: var(--secondary); }
    .page-sub { font-size: 0.85rem; color: rgba(255,255,255,0.4); }

    /* ── Live pulse ── */
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 600; color: var(--green);
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      padding: 4px 12px; border-radius: 20px;
      margin-bottom: 24px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 70px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-state .empty-icon {
      font-size: 3.5rem; margin-bottom: 16px; display: block;
      opacity: 0.4;
    }
    .empty-state p { font-size: 1rem; margin-bottom: 20px; }
    .empty-state a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 30px;
      background: var(--secondary); color: var(--primary);
      font-weight: 700; font-size: 0.9rem; text-decoration: none;
      transition: background .2s;
    }
    .empty-state a:hover { background: #e8920a; }

    /* ── Order card ── */
    .order-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .order-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    /* Status-based left border */
    .order-card.status-Pending  { border-left: 4px solid var(--orange); }
    .order-card.status-Preparing{ border-left: 4px solid var(--blue); }
    .order-card.status-Done     { border-left: 4px solid #6b7280; }

    /* ── Card top ── */
    .card-top {
      padding: 18px 22px 14px;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-order-id {
      font-size: 0.72rem; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
    }
    .card-customer-name {
      font-size: 1rem; font-weight: 700; color: var(--white);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-time {
      font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-top: 3px;
    }

    /* Status pill */
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-pill.Pending   { background: rgba(249,115,22,0.15); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
    .status-pill.Preparing { background: rgba(59,130,246,0.15);  color: var(--blue);   border: 1px solid rgba(59,130,246,0.3); }
    .status-pill.Done      { background: rgba(156,163,175,0.15); color: #9ca3af;       border: 1px solid rgba(156,163,175,0.3); }

    /* Preparing animation */
    .status-pill.Preparing .pill-icon { animation: spin 1.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status banner ── */
    .status-banner {
      padding: 14px 22px;
      display: flex; align-items: center; gap: 12px;
      font-size: 0.9rem; font-weight: 600;
    }
    .status-banner.Pending   { background: rgba(249,115,22,0.07); color: var(--orange); }
    .status-banner.Preparing { background: rgba(59,130,246,0.07); color: var(--blue); }
    .status-banner.Done      { background: rgba(156,163,175,0.07); color: #9ca3af; }
    .status-banner .banner-icon { font-size: 1.2rem; flex-shrink: 0; }

    /* ── Items ── */
    .card-items { padding: 14px 22px; }
    .card-items-title {
      font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.88rem;
    }
    .item-row:last-child { border-bottom: none; }
    .item-name  { color: rgba(255,255,255,0.8); font-weight: 500; }
    .item-qty   { color: var(--secondary); font-weight: 700; font-size: 0.8rem; margin: 0 12px; }
    .item-price { color: #ffd700; font-weight: 700; }

    /* ── Card footer ── */
    .card-footer {
      padding: 12px 22px;
      background: rgba(255,255,255,0.02);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .card-total { font-size: 0.95rem; font-weight: 700; color: #ffd700; }
    .card-note  { font-size: 0.75rem; color: rgba(255,255,255,0.35); font-style: italic; }

    /* ── Ready popup ── */
    .ready-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .ready-overlay.show { opacity: 1; pointer-events: all; }

    .ready-box {
      background: linear-gradient(145deg, #0a2e1a, #061a0f);
      border: 2px solid var(--green);
      border-radius: 28px;
      padding: 52px 40px 40px;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow: 0 0 80px rgba(34,197,94,0.25), 0 30px 60px rgba(0,0,0,0.5);
      transform: scale(0.88) translateY(20px);
      transition: transform .35s ease;
    }
    .ready-overlay.show .ready-box { transform: scale(1) translateY(0); }

    .ready-emoji {
      font-size: 4rem; display: block; margin-bottom: 20px;
      animation: bounce .6s ease both;
    }
    @keyframes bounce {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .ready-title { font-size: 1.9rem; font-weight: 800; color: var(--green); margin-bottom: 10px; }
    .ready-name  { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    .ready-sub   { font-size: 0.88rem; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 28px; }

    .ready-countdown {
      font-size: 0.82rem; color: rgba(255,255,255,0.35);
      margin-bottom: 28px;
    }
    .ready-countdown span { color: var(--secondary); font-weight: 700; font-size: 1rem; }

    .ready-btn {
      width: 100%; height: 52px;
      background: var(--green); color: #fff;
      border: none; border-radius: 30px;
      font-size: 1rem; font-weight: 800; font-family: inherit;
      cursor: pointer; transition: background .2s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .ready-btn:hover { background: #16a34a; transform: translateY(-2px); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .topbar-nav .nav-pill { padding: 5px 10px; font-size: 0.75rem; }
      .card-top { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <span class="topbar-brand">☕ Coffee Brew</span>
    <nav class="topbar-nav">
      <a href="coffeshop.html#menu" class="nav-pill">Menu</a>
      <a href="myorders.html" class="nav-pill active">My Orders</a>
      <a href="completed.html" class="nav-pill">Completed</a>
    </nav>
  </div>

  <!-- Ready popup -->
  <div class="ready-overlay" id="readyOverlay">
    <div class="ready-box">
      <span class="ready-emoji">🎉</span>
      <div class="ready-title">Order Ready!</div>
      <div class="ready-name" id="readyOrderName"></div>
      <p class="ready-sub">
        Your order is ready at the counter.<br>
        It will move to <strong>Completed Orders</strong> automatically.
      </p>
      <div class="ready-countdown">Redirecting to completed orders in <span id="readyCountdown">0:10</span></div>
      <button class="ready-btn" id="readyDismiss">
        <i class="fas fa-check"></i> Got it, heading over!
      </button>
    </div>
  </div>

  <!-- Page -->
  <div class="page">
    <div class="page-header">
      <h1 class="page-title"><i class="fas fa-receipt"></i> My Orders</h1>
      <p class="page-sub">Your active orders update live as the kitchen works on them.</p>
    </div>

    <div class="live-badge">
      <div class="live-dot"></div>
      Live — refreshes every 2 seconds
    </div>

    <div id="ordersList"></div>
  </div>

  <script src="store.js"></script>
  <script>
    // ── Helpers ──────────────────────────────────────────────────
    function esc(s) {
      return String(s||'')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function parsePrice(s) {
      return parseFloat((s||'0').replace(/[^0-9.]/g,'')) || 0;
    }
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) +
             ' · ' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }

    // ── Status config ─────────────────────────────────────────────
    const STATUS_CFG = {
      Pending:   { icon:'fas fa-clock',        msg:'Your order has been received. We\'ll start preparing it shortly.' },
      Preparing: { icon:'fas fa-fire',          msg:'Your order is being prepared right now. Won\'t be long!' },
      Done:      { icon:'fas fa-check-circle',  msg:'Your order is done. Thank you for visiting Coffee Brew!' },
    };

    // ── Ready popup state ─────────────────────────────────────────
    const shownReadyPopups = new Set();
    let countdownTimer = null;
    let countdownSecs  = 10;

    function showReadyPopup(order) {
      if (shownReadyPopups.has(order.id)) return;
      shownReadyPopups.add(order.id);

      document.getElementById('readyOrderName').textContent =
        '👤 ' + order.customerName + ' — ' + (order.total || '');

      if (order.readyAt) {
        const elapsed = Math.floor((Date.now() - new Date(order.readyAt).getTime()) / 1000);
        countdownSecs = Math.max(1, 10 - elapsed);
      } else {
        countdownSecs = 10;
      }

      updateCountdown();
      document.getElementById('readyOverlay').classList.add('show');

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdownSecs--;
        updateCountdown();
        if (countdownSecs <= 0) {
          clearInterval(countdownTimer);
          dismissPopup();
        }
      }, 1000);
    }

    function updateCountdown() {
      document.getElementById('readyCountdown').textContent =
        countdownSecs > 0 ? '0:' + String(countdownSecs).padStart(2,'0') : '0:00';
    }

    function dismissPopup() {
      document.getElementById('readyOverlay').classList.remove('show');
      render();
    }

    document.getElementById('readyDismiss').addEventListener('click', () => {
      clearInterval(countdownTimer);
      dismissPopup();
    });

    // ── Render ────────────────────────────────────────────────────
    function render() {
      const allOrders = CoffeeStore.getOrders();

      // Show only Pending and Preparing in My Orders
      // Ready orders move to Completed page — trigger popup notification
      const active = allOrders.filter(o => o.status === 'Pending' || o.status === 'Preparing');

      // Trigger popup for Ready orders (notification only, no data removal)
      allOrders.filter(o => o.status === 'Ready').forEach(o => showReadyPopup(o));

      const el = document.getElementById('ordersList');

      if (!active.length) {
        el.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">☕</span>
            <p>No active orders right now.</p>
            <a href="coffeshop.html#menu"><i class="fas fa-utensils"></i> Browse Menu</a>
          </div>`;
        return;
      }

      el.innerHTML = active.map(order => {
        const cfg = STATUS_CFG[order.status] || STATUS_CFG.Pending;

        const itemsHtml = order.items.map(item => {
          const unit = parsePrice(item.price);
          const line = unit * item.qty;
          return `<div class="item-row">
            <span class="item-name">${esc(item.name)}</span>
            <span class="item-qty">×${item.qty}</span>
            <span class="item-price">${unit > 0 ? '$'+line.toFixed(2) : esc(item.price)}</span>
          </div>`;
        }).join('');

        return `
          <div class="order-card status-${esc(order.status)}">

            <div class="card-top">
              <div class="card-meta">
                <div class="card-order-id">Order #${order.id}</div>
                <div class="card-customer-name">👤 ${esc(order.customerName)}</div>
                <div class="card-time">${formatTime(order.timestamp)}</div>
              </div>
              <div class="status-pill ${esc(order.status)}">
                <i class="${cfg.icon} pill-icon"></i>
                ${esc(order.status)}
              </div>
            </div>

            <div class="status-banner ${esc(order.status)}">
              <i class="${cfg.icon} banner-icon"></i>
              <span>${cfg.msg}</span>
            </div>

            <div class="card-items">
              <div class="card-items-title">Items</div>
              ${itemsHtml}
            </div>

            <div class="card-footer">
              <span class="card-total">Total: ${esc(order.total || '—')}</span>
              ${order.note ? `<span class="card-note">"${esc(order.note)}"</span>` : ''}
            </div>

          </div>`;
      }).join('');
    }

    // ── Init + poll ───────────────────────────────────────────────
    render();
    setInterval(render, 2000);
  </script>
</body>
</html>
