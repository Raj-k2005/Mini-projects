<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Orders — Coffee Brew</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary:   #3b141c;
      --secondary: #f3a01c;
      --dark:      #1a0a0e;
      --white:     #fff;
      --green:     #22c55e;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--primary);
      padding: 0 24px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: sticky; top:0; z-index:100;
    }
    .topbar-brand { font-size:1.1rem; font-weight:800; color:var(--secondary); letter-spacing:1px; }
    .topbar-nav { display:flex; gap:8px; }
    .nav-pill {
      padding: 6px 16px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 600;
      text-decoration: none; color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all .2s;
    }
    .nav-pill:hover { color:#fff; border-color:rgba(255,255,255,0.3); }
    .nav-pill.active { color:var(--secondary); border-color:var(--secondary); background:rgba(243,160,28,0.08); }

    /* ── Page ── */
    .page { max-width: 700px; margin: 0 auto; padding: 36px 20px 80px; }

    .page-header { margin-bottom: 28px; }
    .page-title {
      font-size: 1.6rem; font-weight: 800; color: var(--white);
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .page-title i { color: var(--green); }
    .page-sub { font-size: 0.85rem; color: rgba(255,255,255,0.4); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .count-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.78rem; font-weight: 600; color: var(--green);
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      padding: 5px 14px; border-radius: 20px;
    }
    .clear-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 18px; border-radius: 20px;
      background: transparent; border: 1px solid rgba(239,68,68,0.3);
      color: rgba(239,68,68,0.7); font-size: 0.8rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .clear-btn:hover { background: rgba(239,68,68,0.1); color: #ef4444; }

    /* ── Empty ── */
    .empty-state {
      text-align: center; padding: 70px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-state .empty-icon { font-size: 3.5rem; margin-bottom: 16px; display: block; opacity: 0.4; }
    .empty-state p { font-size: 1rem; margin-bottom: 20px; }
    .empty-state a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 30px;
      background: var(--secondary); color: var(--primary);
      font-weight: 700; font-size: 0.9rem; text-decoration: none;
      transition: background .2s;
    }
    .empty-state a:hover { background: #e8920a; }

    /* ── Order card ── */
    .order-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(34,197,94,0.18);
      border-left: 4px solid var(--green);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      transition: transform .25s ease, box-shadow .25s ease;
      animation: slideIn .35s ease both;
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .order-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(34,197,94,0.1);
    }

    /* ── Card top ── */
    .card-top {
      padding: 18px 22px 14px;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-order-id {
      font-size: 0.72rem; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
    }
    .card-customer-name {
      font-size: 1rem; font-weight: 700; color: var(--white);
    }
    .card-time { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-top: 3px; }

    .done-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 700;
      background: rgba(34,197,94,0.15);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.3);
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Ready banner ── */
    .ready-banner {
      padding: 12px 22px;
      background: rgba(34,197,94,0.07);
      display: flex; align-items: center; gap: 10px;
      font-size: 0.88rem; font-weight: 600; color: var(--green);
      border-bottom: 1px solid rgba(34,197,94,0.1);
    }

    /* ── Items ── */
    .card-items { padding: 14px 22px; }
    .card-items-title {
      font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.88rem;
    }
    .item-row:last-child { border-bottom: none; }
    .item-name  { color: rgba(255,255,255,0.8); font-weight: 500; }
    .item-qty   { color: var(--secondary); font-weight: 700; font-size: 0.8rem; margin: 0 12px; }
    .item-price { color: #ffd700; font-weight: 700; }

    /* ── Card footer ── */
    .card-footer {
      padding: 12px 22px;
      background: rgba(255,255,255,0.02);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .card-total { font-size: 0.95rem; font-weight: 700; color: #ffd700; }
    .card-note  { font-size: 0.75rem; color: rgba(255,255,255,0.35); font-style: italic; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .topbar-nav .nav-pill { padding: 5px 10px; font-size: 0.75rem; }
      .card-top { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <span class="topbar-brand">☕ Coffee Brew</span>
    <nav class="topbar-nav">
      <a href="coffeshop.html#menu" class="nav-pill">Menu</a>
      <a href="myorders.html" class="nav-pill">My Orders</a>
      <a href="completed.html" class="nav-pill active">Completed</a>
    </nav>
  </div>

  <!-- Page -->
  <div class="page">
    <div class="page-header">
      <h1 class="page-title"><i class="fas fa-check-circle"></i> Completed Orders</h1>
      <p class="page-sub">Orders that are ready for pickup or have been fulfilled.</p>
    </div>

    <div class="toolbar">
      <div class="count-badge" id="countBadge">
        <i class="fas fa-check"></i> <span id="countText">0 orders</span>
      </div>
      <button class="clear-btn" id="clearBtn">
        <i class="fas fa-trash"></i> Clear History
      </button>
    </div>

    <div id="ordersList"></div>
  </div>

  <script src="store.js"></script>
  <script>
    function esc(s) {
      return String(s||'')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function parsePrice(s) {
      return parseFloat((s||'0').replace(/[^0-9.]/g,'')) || 0;
    }
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) +
             ' · ' + d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    }

    function render() {
      // Read Ready orders directly from active orders — no archiving needed
      const orders = CoffeeStore.getOrders().filter(o => o.status === 'Ready');
      const el     = document.getElementById('ordersList');

      document.getElementById('countText').textContent =
        orders.length + (orders.length === 1 ? ' order' : ' orders');

      if (!orders.length) {
        el.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">✅</span>
            <p>No completed orders yet.</p>
            <a href="myorders.html"><i class="fas fa-receipt"></i> View Active Orders</a>
          </div>`;
        return;
      }

      el.innerHTML = orders.map(order => {
        const itemsHtml = order.items.map(item => {
          const unit = parsePrice(item.price);
          const line = unit * item.qty;
          return `<div class="item-row">
            <span class="item-name">${esc(item.name)}</span>
            <span class="item-qty">×${item.qty}</span>
            <span class="item-price">${unit > 0 ? '$'+line.toFixed(2) : esc(item.price)}</span>
          </div>`;
        }).join('');

        return `
          <div class="order-card">
            <div class="card-top">
              <div class="card-meta">
                <div class="card-order-id">Order #${order.id}</div>
                <div class="card-customer-name">👤 ${esc(order.customerName)}</div>
                <div class="card-time">${formatTime(order.completedAt || order.timestamp)}</div>
              </div>
              <div class="done-badge"><i class="fas fa-check-circle"></i> Ready</div>
            </div>

            <div class="ready-banner">
              <i class="fas fa-bell"></i>
              Your order is ready — please collect it at the counter!
            </div>

            <div class="card-items">
              <div class="card-items-title">Items Ordered</div>
              ${itemsHtml}
            </div>

            <div class="card-footer">
              <span class="card-total">Total: ${esc(order.total || '—')}</span>
              ${order.note ? `<span class="card-note">"${esc(order.note)}"</span>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('This will delete all Ready orders from the system. Are you sure?')) {
        // Remove Ready orders from active orders
        const remaining = CoffeeStore.getOrders().filter(o => o.status !== 'Ready');
        localStorage.setItem('cb_orders', JSON.stringify(remaining));
        render();
      }
    });

    // Live refresh every 2 seconds
    render();
    setInterval(render, 2000);
  </script>
</body>
</html>
